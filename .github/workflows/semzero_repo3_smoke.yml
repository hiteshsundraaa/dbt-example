name: SemZero Repo 3 Smoke

on:
  push:
    branches:
      - semzero/repo3-enum-smoke
  pull_request:
    paths:
      - "models/**/*.sql"
      - "models/**/*.yml"
      - "models/**/*.yaml"
      - "dbt_project.yml"
      - ".semzero/**"
      - ".github/workflows/semzero_repo3_smoke.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  semzero:
    name: dbt enum drift smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run SemZero Assumption Gate
        uses: hiteshsundraaa/semzero-public-alpha-launch@542e97340844b338c580562d0c9821bcbed40bfd
        with:
          mode: shadow
          extra-pip-packages: "dbt-core dbt-duckdb"
          dbt-profiles-dir: ".semzero"
          artifact-dir: "data/semzero_assumption_gate"
          post-pr-comment: "true"
