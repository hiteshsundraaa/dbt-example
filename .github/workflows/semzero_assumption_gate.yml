name: SemZero Assumption Gate

on:
  pull_request:
  push:
    branches:
      - semzero-repo3-enum-null-test
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  semzero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: hiteshsundraaa/semzero-public-alpha-launch@3a3e75d2131c94884cb8a13a05da11ea5df7142f
        with:
          mode: shadow
          run-dbt-compile: "true"
          extra-pip-packages: "dbt-core dbt-duckdb"
          dbt-profiles-dir: ".semzero"
