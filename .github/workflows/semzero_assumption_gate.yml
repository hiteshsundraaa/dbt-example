name: SemZero Assumption Gate

on:
  pull_request:
  push:
    branches:
      - semzero-repo3-enum-null-test
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  semzero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: hiteshsundraaa/semzero-public-alpha-launch@eed23058a8f0f40d6635b020ef21837ed73304e0
        with:
          mode: shadow
          run-dbt-compile: "true"
          extra-pip-packages: "dbt-core dbt-duckdb"
          dbt-profiles-dir: ".semzero"
